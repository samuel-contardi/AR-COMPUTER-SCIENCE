<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Bateria — ZolpiBeat (Grupo 7)</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { background: #101015; color: #f2f4fa; font-family: system-ui, sans-serif; }
      body { padding: 16px 20px 64px; }
      h1 { font-size: 20px; margin-bottom: 4px; }
      h2 { font-size: 15px; margin: 28px 0 8px; color: #cdd3e6; }
      p { font-size: 13px; line-height: 1.5; color: #cdd3e6; margin: 4px 0; }
      #cena { width: 100%; max-width: 720px; height: 420px; display: block; background: #000; border-radius: 6px; }
      button { background: #4f7cff; color: #fff; border: none; padding: 8px 14px; border-radius: 4px;
               font-size: 13px; cursor: pointer; margin: 6px 6px 6px 0; }
      button:hover { background: #3d63d6; }
      pre { background: #14151c; padding: 10px; border-radius: 4px; font-size: 12px; overflow-x: auto; }
      #diario { max-height: 160px; overflow-y: auto; background: #14151c; padding: 8px 10px; border-radius: 4px; }
      #diario p { margin: 2px 0; }
    </style>
  </head>
  <body>
    <h1>Bateria — ambiente de ensaio (Grupo 7, ZolpiBeat)</h1>
    <p>Módulo 03: a cena como árvore, o laço contra o relógio e o custo de quadro no painel dentro da cena.</p>

    <canvas id="cena"></canvas>
    <div>
      <button id="prender" type="button">Prender o prato de ataque na haste</button>
      <button id="sondar" type="button">Sondar capacidades do aparelho</button>
    </div>

    <h2>Estrutura da cena</h2>
    <div id="estrutura"></div>

    <h2>Relatório do domínio e da sonda (sem sessão)</h2>
    <div id="relatorio"></div>

    <h2>Sonda de capacidades (com sessão)</h2>
    <div id="sonda"></div>

    <h2>Diário de atividades</h2>
    <div id="diario"></div>

    <script type="module" src="/src/bancada/main.ts"></script>
  </body>
</html>
